<text x="841" y="1121" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#183442" text-anchor="start">More processes</text>
<text x="841" y="1153" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#536973" text-anchor="start">N processes → up to 37N app connections</text>
<text x="841" y="1188" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#536973" text-anchor="start">Workers run in each process</text>
<text x="841" y="1223" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#536973" text-anchor="start">Caches and rate limits are local</text>
