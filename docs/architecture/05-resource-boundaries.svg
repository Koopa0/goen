<marker id="arrow-muted" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto-start-reverse" viewBox="0 0 13 13"><path d="M 1 1 L 12 6.5 L 1 12 Z" fill="#536973"/></marker>
