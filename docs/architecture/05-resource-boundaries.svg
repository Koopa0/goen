<text x="86" y="1121" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#183442" text-anchor="start">Image limits</text>
<text x="86" y="1153" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#536973" text-anchor="start">64 MiB encoded cache per renderer</text>
<text x="86" y="1188" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#536973" text-anchor="start">Render slots: max(1, min(GOMAXPROCS, 4))</text>
<text x="86" y="1223" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#536973" text-anchor="start">Upload slots: 2</text>
<text x="86" y="1258" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#536973" text-anchor="start">singleflight joins identical misses</text>
