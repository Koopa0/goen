<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1190" viewBox="0 0 1600 1190" role="img" aria-labelledby="title desc">
<title id="title">Payment–stock race</title>
<desc id="desc">Payment capture and stock release serialize on the order lock.</desc>
<defs>
<marker id="arrow-navy" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto-start-reverse" viewBox="0 0 13 13"><path d="M 1 1 L 12 6.5 L 1 12 Z" fill="#183442"/></marker>
<marker id="arrow-teal" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto-start-reverse" viewBox="0 0 13 13"><path d="M 1 1 L 12 6.5 L 1 12 Z" fill="#126E65"/></marker>
<marker id="arrow-amber" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto-start-reverse" viewBox="0 0 13 13"><path d="M 1 1 L 12 6.5 L 1 12 Z" fill="#926021"/></marker>
<marker id="arrow-muted" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto-start-reverse" viewBox="0 0 13 13"><path d="M 1 1 L 12 6.5 L 1 12 Z" fill="#536973"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="1190" rx="0" fill="#F8F7F2" stroke="none" stroke-width="1.6"/>
<text x="60" y="79" font-family="DejaVu Sans, Arial, sans-serif" font-size="41" font-weight="700" fill="#183442" text-anchor="start">Payment–stock race</text>
<polyline points="60,125 1540,125" fill="none" stroke="#D4DEDA" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(0,-60)">
<rect x="70" y="235" width="635" height="150" rx="17" fill="#FFFFFF" stroke="#D4DEDA" stroke-width="1.6"/>
<rect x="94" y="257" width="7" height="30" rx="3" fill="#126E65" stroke="none" stroke-width="1.6"/>
<text x="117" y="281" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#183442" text-anchor="start">Payment capture</text>
<text x="96" y="313" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#536973" text-anchor="start">Verified provider payment.</text>
<rect x="895" y="235" width="635" height="150" rx="17" fill="#FFFFFF" stroke="#D4DEDA" stroke-width="1.6"/>
<rect x="919" y="257" width="7" height="30" rx="3" fill="#926021" stroke="none" stroke-width="1.6"/>
<text x="942" y="281" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#183442" text-anchor="start">Reservation release</text>
<text x="921" y="313" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#536973" text-anchor="start">Expiry or cancellation.</text>
<polyline points="388,385 388,425 690,425 690,465" fill="none" stroke="#126E65" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<polyline points="1212,385 1212,425 910,425 910,465" fill="none" stroke="#926021" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
<rect x="490" y="465" width="620" height="135" rx="17" fill="#183442" stroke="#D4DEDA" stroke-width="1.6"/>
<text x="516" y="511" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">Order lock</text>
<text x="516" y="543" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#D8E6E1" text-anchor="start">First committed transition wins.</text>
<polyline points="670,600 670,640 390,640 390,700" fill="none" stroke="#126E65" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<polyline points="930,600 930,640 1210,640 1210,700" fill="none" stroke="#926021" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
<rect x="294" y="649" width="192" height="38" rx="0" fill="#F8F7F2" stroke="none" stroke-width="1.6"/>
<rect x="1114" y="649" width="192" height="38" rx="0" fill="#F8F7F2" stroke="none" stroke-width="1.6"/>
<text x="390" y="678" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#126E65" text-anchor="middle">Capture wins</text>
<text x="1210" y="678" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#926021" text-anchor="middle">Release wins</text>
<rect x="70" y="700" width="650" height="305" rx="17" fill="#E8F2EE" stroke="#AACBBF" stroke-width="1.6"/>
<text x="102" y="747" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#126E65" text-anchor="start">ORDER COMMITTED</text>
<text x="102" y="802" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#183442" text-anchor="start">Verified payment captured.</text>
<polyline points="102,855 688,855" fill="none" stroke="#B6D1C7" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="102" y="903" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#536973" text-anchor="start">Release refused; stock stays reserved.</text>
<rect x="880" y="700" width="650" height="305" rx="17" fill="#FFF1DD" stroke="#DBC8AB" stroke-width="1.6"/>
<text x="912" y="747" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#926021" text-anchor="start">RESERVATION RELEASED</text>
<text x="912" y="802" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#183442" text-anchor="start">Release persisted.</text>
<polyline points="912,855 1498,855" fill="none" stroke="#DECDB4" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="912" y="903" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#536973" text-anchor="start">Late capture is refused locally; an external</text>
<text x="912" y="942" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#536973" text-anchor="start">charge may exist.</text>
<polyline points="390,1005 390,1050" fill="none" stroke="#126E65" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<polyline points="1210,1005 1210,1050" fill="none" stroke="#926021" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
<rect x="70" y="1050" width="650" height="150" rx="17" fill="#FFFFFF" stroke="#D4DEDA" stroke-width="1.6"/>
<text x="96" y="1096" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#183442" text-anchor="start">Fulfillment can continue</text>
<text x="96" y="1128" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#536973" text-anchor="start">Payment and stock commitment agree.</text>
<rect x="880" y="1050" width="650" height="150" rx="17" fill="#FFFFFF" stroke="#D4DEDA" stroke-width="1.6"/>
<text x="906" y="1096" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#183442" text-anchor="start">Durable exception → operator refund</text>
<text x="906" y="1128" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#536973" text-anchor="start">Reconcile the charge without reviving released</text>
<text x="906" y="1163" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#536973" text-anchor="start">stock.</text>
</g>
</svg>
