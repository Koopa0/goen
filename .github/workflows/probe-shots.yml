name: probe-shots

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: probe-shots-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  probe-shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      GOEN_DATABASE_URL: postgres://goen:goen@127.0.0.1:5433/goen?sslmode=disable
      GOEN_URL: http://127.0.0.1:9700
      GOEN_ECPAY_MERCHANT_ID: "2000132"
      GOEN_ECPAY_HASH_KEY: ejCk326UnaZWKisg
      GOEN_ECPAY_HASH_IV: q9jcZX8Ib9LM8wYk
      GOEN_ECPAY_LOGISTICS: b2c

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Start PostgreSQL
        run: make db-up

      - name: Migrate, seed and fixtures
        run: |
          set -euo pipefail
          make migrate-up
          make db-seed
          psql "$GOEN_DATABASE_URL" -X -q -v env=fixtures.env -f scripts/check-layout.sql
          set -a; . ./fixtures.env; set +a
          # A return still waiting for its decision, and a second staff account
          # for the second-factor screens, with two sessions.
          tokenA=$(openssl rand -hex 32)
          tokenB=$(openssl rand -hex 32)
          psql "$GOEN_DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -v form_order="$RETURN_FORM_ORDER" -v tokenA="$tokenA" -v tokenB="$tokenB" <<'SQL'
          SET ROLE admin;
          SELECT upsert_staff('twofa-check@goen.invalid', '', 'admin');
          SELECT id AS twofa_id FROM users WHERE lower(email) = 'twofa-check@goen.invalid' AND role = 'admin' \gset
          SELECT o.id AS form_id, o.user_id AS form_user FROM orders o WHERE o.order_number = :'form_order' \gset
          SET ROLE store;
          INSERT INTO sessions (token_hash, user_id, expires_at)
          VALUES (sha256(convert_to(:'tokenA', 'UTF8')), :'twofa_id', now() + interval '2 hours'),
                 (sha256(convert_to(:'tokenB', 'UTF8')), :'twofa_id', now() + interval '2 hours');
          INSERT INTO return_requests (order_id, requested_by_user_id, reason)
          VALUES (:'form_id', :'form_user', '收到時外盒有壓痕，想退貨')
          RETURNING id AS pending_return_id \gset
          INSERT INTO return_request_lines (order_id, return_request_id, order_line_id, quantity)
          SELECT order_id, :'pending_return_id', id, quantity FROM order_lines WHERE order_id = :'form_id';
          SQL
          echo "TWOFA_TOKEN_A=$tokenA" >> fixtures.env
          echo "TWOFA_TOKEN_B=$tokenB" >> fixtures.env
          sed -E 's/(TOKEN[A-Z_]*)=.*/\1=<hidden>/' fixtures.env

      - name: Build
        run: |
          set -euo pipefail
          make build
          go run ./cmd/emailshots shots/emails-src "$GOEN_URL"
          ls shots/emails-src | wc -l

      - name: Capture
        run: |
          set -euo pipefail
          chrome=$(scripts/resolve-chrome.sh)
          "$chrome" --version
          profile=$(mktemp -d)
          nice -n 10 "$chrome" --headless --disable-gpu --no-first-run --lang=zh-TW \
            --remote-debugging-port=9333 --user-data-dir="$profile" about:blank > chrome-shots.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT
          sleep 3
          set -a; . ./fixtures.env; set +a
          status=0

          serve() {
            (GOEN_INSECURE_COOKIES=1 exec ./bin/goen >> "server-$1.log" 2>&1) &
            server_pid=$!
            for _ in $(seq 1 60); do
              if curl -sf -o /dev/null "$GOEN_URL/readyz"; then return 0; fi
              if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            echo "the $1 server never answered /readyz" >&2
            tail -50 "server-$1.log" >&2
            exit 1
          }
          stop() {
            kill "$server_pid"
            while kill -0 "$server_pid" 2>/dev/null; do sleep 0.5; done
          }

          serve plain
          for m in emails storefront admin; do
            echo "::group::$m"
            CDP_PORT=9333 node scripts/probe-shots.mjs "$m" shots shots/emails-src || status=$?
            echo '::endgroup::'
          done
          stop

          export GOEN_TOTP_KEY=000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
          serve totp
          echo '::group::twofa'
          CDP_PORT=9333 node scripts/probe-shots.mjs twofa shots || status=$?
          echo '::endgroup::'
          stop

          ls shots | wc -l
          exit "$status"

      - name: Keep the shots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-shots
          path: |
            shots/
            server-*.log
            chrome-shots.log
          if-no-files-found: warn
