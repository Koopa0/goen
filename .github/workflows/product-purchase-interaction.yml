name: Product purchase interaction

on:
  pull_request:
    paths:
      - assets/js/goen.js
      - internal/ui/pages/product.templ
      - internal/ui/pages/product_purchase_browser_integration_test.go
      - scripts/product-purchase-check.mjs
      - .github/workflows/product-purchase-interaction.yml

permissions:
  contents: read

concurrency:
  group: product-purchase-interaction-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-purchase:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Native request and response ordering
        run: |
          GOEN_CHROME="$(scripts/resolve-chrome.sh)"
          export GOEN_CHROME
          go test -tags integration -count=1 -v -run '^TestProductChoiceAgainstAnInFlightPurchase$' ./internal/ui/pages
