name: verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Never let the toolchain silently upgrade itself: the version in go.mod is
  # the version this project is verified against.
  GOTOOLCHAIN: local

jobs:
  ci-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Validate workflow syntax and gate contracts
        run: make workflow-check

  commit-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject attribution in the branch commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/check-commit-attribution.sh "$BASE_SHA" "$HEAD_SHA"

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Confirm the exact Go version
        run: |
          set -euo pipefail
          declared=$(awk '$1 == "go" { print $2; exit }' go.mod)
          test "$(go env GOVERSION)" = "go$declared"

      # Versions come from the Makefile, which is where they are pinned and
      # where the targets version-check against them. Repeating a number here
      # made CI install squawk 2.63.0 against a Makefile that demanded 2.64.0.
      - name: Install golangci-lint
        run: |
          set -euo pipefail
          version=$(awk -F':= *' '$1 ~ /^GOLANGCI_LINT_VERSION/ { print $2; exit }' Makefile)
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v$version"

      - name: Install squawk
        run: |
          set -euo pipefail
          version=$(awk -F':= *' '$1 ~ /^SQUAWK_VERSION/ { print $2; exit }' Makefile)
          npm install -g "squawk-cli@$version"

      # Everything that needs neither Docker nor the network beyond the module
      # cache. Runs first so an ordinary mistake is reported in a minute rather
      # than after the container work.
      - name: Verify
        run: make verify

  # Separate job: it needs Docker, and keeping it apart means a failure here
  # reads as "the database contract broke" rather than as a slow lint run.
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      # The suite derives what it must cover from the system catalog, so this
      # job also fails when a constraint is added without a case for it.
      - name: Schema conformance
        run: make test-integration

      # A down migration that does not undo the up migration is only ever
      # discovered when someone needs it.
      - name: Migration round trip
        run: |
          set -euo pipefail
          make db-up
          export GOEN_DATABASE_URL='postgres://goen:goen@127.0.0.1:5433/goen?sslmode=disable'
          make migrate-up
          migrate=$(awk -F':= *' '$1 ~ /^MIGRATE_VERSION/ { print $2; exit }' Makefile)
          go run -tags=postgres "github.com/golang-migrate/migrate/v4/cmd/migrate@$migrate" \
            -path migrations -database "$GOEN_DATABASE_URL" down -all
          make migrate-up

  # The browser gate. Separate again, and for the third distinct reason: it needs
  # a database, a running server AND a Chrome, so a failure here reads as "a page
  # broke" rather than as a slow lint run or a schema change.
  #
  # needs: verify, because there is no sense spending five minutes seeding a
  # catalogue for a tree that does not compile.
  layout:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      # The compose file owns the credentials and the port; this is the same URL
      # the schema job's round trip uses.
      GOEN_DATABASE_URL: postgres://goen:goen@127.0.0.1:5433/goen?sslmode=disable
      GOEN_URL: http://127.0.0.1:9700

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Docker compose rather than a services: block, so the image, the port and
      # the credentials stay stated once, in the file the developer runs.
      - name: Start PostgreSQL
        run: make db-up

      - name: Migrate and seed
        run: |
          set -euo pipefail
          make migrate-up
          make db-seed

      # Backgrounded with its output redirected: a step that leaves the server on
      # the step's own pipe does not return until the server exits.
      #
      # GOEN_INSECURE_COOKIES is what `make run` sets locally. Without it the cart
      # cookie carries Secure and a browser never sends it back over http, so the
      # cart pages would measure an empty cart and pass.
      - name: Start the storefront
        run: |
          set -euo pipefail
          make build
          GOEN_INSECURE_COOKIES=1 ./bin/goen > server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null "$GOEN_URL/readyz"; then
              exit 0
            fi
            sleep 1
          done
          echo 'the server never answered /readyz' >&2
          cat server.log >&2
          exit 1

      # shell: bash for pipefail — tee otherwise reports ITS exit status and a red
      # gate reads as green. Chrome is resolved by scripts/resolve-chrome.sh, which
      # finds the runner's google-chrome without this file naming a path.
      - name: Layout and accessibility gate
        shell: bash
        run: make check-layout 2>&1 | tee layout.log

      - name: Keep the run's output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layout
          path: |
            layout.log
            server.log
          if-no-files-found: warn

  vulnerabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: govulncheck
        run: make vuln

  load-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Install load evidence clients
        run: sudo apt-get update && sudo apt-get install -y postgresql-client jq
      - name: Fresh two-instance replay positive control
        env:
          LOAD_RUN_ID: ci-replay-${{ github.run_id }}-${{ github.run_attempt }}
          LOAD_K6_VUS_MAX: '4'
        run: |
          make load-up
          bash load/scripts/run-profile.sh stock-contention
      - name: Fresh fixture with replay removed must fail
        run: |
          bash load/scripts/stop-instances.sh
          make load-up
          bash load/scripts/check-replay-control.sh
      - name: Preserve load evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-replay-${{ github.sha }}
          path: |
            load/evidence/**/*.json
            load/evidence/**/*.jsonl
            load/evidence/**/*.txt
            load/evidence/**/*.log
            load/.run/*.log
          include-hidden-files: true
          if-no-files-found: warn
      - name: Remove isolated topology
        if: always()
        run: make load-down
