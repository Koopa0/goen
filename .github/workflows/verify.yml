name: verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Never let the toolchain silently upgrade itself: the version in go.mod is
  # the version this project is verified against.
  GOTOOLCHAIN: local

jobs:
  ci-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Validate workflow syntax and gate contracts
        run: make workflow-check

  commit-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject attribution in the branch commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/check-commit-attribution.sh "$BASE_SHA" "$HEAD_SHA"

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Confirm the exact Go version
        run: |
          set -euo pipefail
          declared=$(awk '$1 == "go" { print $2; exit }' go.mod)
          test "$(go env GOVERSION)" = "go$declared"

      # Versions come from the Makefile, which is where they are pinned and
      # where the targets version-check against them. Repeating a number here
      # made CI install squawk 2.63.0 against a Makefile that demanded 2.64.0.
      - name: Install golangci-lint
        run: |
          set -euo pipefail
          version=$(awk -F':= *' '$1 ~ /^GOLANGCI_LINT_VERSION/ { print $2; exit }' Makefile)
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v$version"

      - name: Install squawk
        run: |
          set -euo pipefail
          version=$(awk -F':= *' '$1 ~ /^SQUAWK_VERSION/ { print $2; exit }' Makefile)
          npm install -g "squawk-cli@$version"

      # Everything that needs neither Docker nor the network beyond the module
      # cache. Runs first so an ordinary mistake is reported in a minute rather
      # than after the container work.
      - name: Verify
        run: make verify

  # Separate job: it needs Docker, and keeping it apart means a failure here
  # reads as "the database contract broke" rather than as a slow lint run.
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      # The suite derives what it must cover from the system catalog, so this
      # job also fails when a constraint is added without a case for it.
      - name: Schema conformance
        run: make test-integration

      # A down migration that does not undo the up migration is only ever
      # discovered when someone needs it.
      - name: Migration round trip
        run: |
          set -euo pipefail
          make db-up
          export GOEN_DATABASE_URL='postgres://goen:goen@127.0.0.1:5433/goen?sslmode=disable'
          make migrate-up
          migrate=$(awk -F':= *' '$1 ~ /^MIGRATE_VERSION/ { print $2; exit }' Makefile)
          go run -tags=postgres "github.com/golang-migrate/migrate/v4/cmd/migrate@$migrate" \
            -path migrations -database "$GOEN_DATABASE_URL" down -all
          make migrate-up

  vulnerabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: govulncheck
        run: make vuln

  load-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Install load evidence clients
        run: sudo apt-get update && sudo apt-get install -y postgresql-client jq
      - name: Fresh two-instance replay positive control
        env:
          LOAD_RUN_ID: ci-replay-${{ github.run_id }}-${{ github.run_attempt }}
          LOAD_K6_VUS_MAX: '4'
        run: |
          make load-up
          bash load/scripts/run-profile.sh stock-contention
      - name: Fresh fixture with replay removed must fail
        run: |
          bash load/scripts/stop-instances.sh
          make load-up
          bash load/scripts/check-replay-control.sh
      - name: Preserve load evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-replay-${{ github.sha }}
          path: |
            load/evidence/**/*.json
            load/evidence/**/*.jsonl
            load/evidence/**/*.txt
            load/evidence/**/*.log
            load/.run/*.log
          include-hidden-files: true
          if-no-files-found: warn
      - name: Remove isolated topology
        if: always()
        run: make load-down
