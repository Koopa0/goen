name: layout reproduction

on:
  pull_request:
    paths:
      - scripts/check-layout.mjs
      - .github/workflows/layout-reproduction.yml

permissions:
  contents: read

concurrency:
  group: layout-reproduction-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      # The compose file owns the credentials and the port; this is the same URL
      # the schema job's round trip uses.
      GOEN_DATABASE_URL: postgres://goen:goen@127.0.0.1:5433/goen?sslmode=disable
      GOEN_URL: http://127.0.0.1:9700

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Docker compose rather than a services: block, so the image, the port and
      # the credentials stay stated once, in the file the developer runs.
      - name: Start PostgreSQL
        run: make db-up

      - name: Migrate and seed
        run: |
          set -euo pipefail
          make migrate-up
          make db-seed

      # Backgrounded with its output redirected: a step that leaves the server on
      # the step's own pipe does not return until the server exits.
      #
      # GOEN_INSECURE_COOKIES is what `make run` sets locally. Without it the cart
      # cookie carries Secure and a browser never sends it back over http, so the
      # cart pages would measure an empty cart and pass.
      #
      # The ECPay values are the published staging test credentials from .env.example,
      # public by design. The store map is on so the layout gate measures the pickup
      # chooser; the map needs the merchant id, and the invoice gateway shares
      # it and refuses an id without its key and IV. That enables the invoice
      # worker too, which stays idle: the Makefile fixture's one invoice operation
      # is scheduled a day ahead, so no call reaches ECPay.
      - name: Start the storefront
        env:
          GOEN_ECPAY_MERCHANT_ID: "2000132"
          GOEN_ECPAY_HASH_KEY: ejCk326UnaZWKisg
          GOEN_ECPAY_HASH_IV: q9jcZX8Ib9LM8wYk
          GOEN_ECPAY_LOGISTICS: b2c
        run: |
          set -euo pipefail
          make build
          GOEN_INSECURE_COOKIES=1 ./bin/goen > server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null "$GOEN_URL/readyz"; then
              exit 0
            fi
            sleep 1
          done
          echo 'the server never answered /readyz' >&2
          cat server.log >&2
          exit 1

      # shell: bash for pipefail — tee otherwise reports ITS exit status and a red
      # gate reads as green. Chrome is resolved by scripts/resolve-chrome.sh, which
      # finds the runner's google-chrome without this file naming a path.
      - name: Layout and accessibility gate
        shell: bash
        run: make check-layout 2>&1 | tee layout.log

      - name: Keep the run's output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layout
          path: |
            layout.log
            server.log
          if-no-files-found: warn

