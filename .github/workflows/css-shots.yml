name: css-shots

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: css-shots-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  BEFORE_SHA: 46b2a47200147e4d7a639fff63c6a6e4d035f2f7
  AFTER_SHA: b64095e2215c838377f90dee206141ce2fe2b2b8

jobs:
  css-shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      GOEN_DATABASE_URL: postgres://goen:goen@127.0.0.1:5433/goen?sslmode=disable
      GOEN_URL: http://127.0.0.1:9700
      GOEN_ECPAY_MERCHANT_ID: "2000132"
      GOEN_ECPAY_HASH_KEY: ejCk326UnaZWKisg
      GOEN_ECPAY_HASH_IV: q9jcZX8Ib9LM8wYk
      GOEN_ECPAY_LOGISTICS: b2c

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Start PostgreSQL
        run: make db-up

      - name: Migrate and seed
        run: |
          set -euo pipefail
          make migrate-up
          make db-seed

      - name: Fixtures
        run: |
          set -euo pipefail
          psql "$GOEN_DATABASE_URL" -X -q -v env=fixtures.env -f scripts/check-layout.sql
          cat fixtures.env | sed -E 's/(TOKEN)=.*/\1=<hidden>/'

      - name: Build before and after
        run: |
          set -euo pipefail
          mkdir -p builds
          for which in before after; do
            sha_var=$(echo "${which}_SHA" | tr a-z A-Z)
            git worktree add "wt-$which" "${!sha_var}"
            (cd "wt-$which" && git log -1 --format="$which: %H %s" && make build && cp bin/goen "../builds/goen-$which")
          done

      - name: Capture
        run: |
          set -euo pipefail
          chrome=$(scripts/resolve-chrome.sh)
          "$chrome" --version
          profile=$(mktemp -d)
          nice -n 10 "$chrome" --headless --disable-gpu --no-first-run \
            --remote-debugging-port=9333 --user-data-dir="$profile" about:blank > chrome-shots.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT
          sleep 3
          set -a; . ./fixtures.env; set +a
          status=0
          for which in before after; do
            echo "::group::$which"
            # Each build runs from its own checkout so it serves its own embedded assets.
            (cd "wt-$which" && GOEN_INSECURE_COOKIES=1 ../builds/goen-$which > "../server-$which.log" 2>&1 & echo $! > "../goen-$which.pid")
            for _ in $(seq 1 60); do
              if curl -sf -o /dev/null "$GOEN_URL/readyz"; then break; fi
              sleep 1
            done
            CDP_PORT=9333 node scripts/css-shots.mjs "shots/$which" || status=$?
            pid=$(cat "goen-$which.pid")
            kill "$pid"
            while kill -0 "$pid" 2>/dev/null; do sleep 0.5; done
            echo '::endgroup::'
          done
          file shots/*/*.png
          exit "$status"

      - name: Keep the shots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: css-shots
          path: |
            shots/
            server-*.log
            chrome-shots.log
          if-no-files-found: warn
