name: admin-shots

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: admin-shots-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  # The layout job's stack up to its gate: the same compose database, migrate and
  # seed, build and server start, and the Chrome resolve-chrome.sh finds. The
  # gate's fixtures (scripts/check-layout.sql) are never run here.
  admin-shots:
    strategy:
      fail-fast: false
      matrix:
        side: [before, after]
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      GOEN_DATABASE_URL: postgres://goen:goen@127.0.0.1:5433/goen?sslmode=disable
      GOEN_URL: http://127.0.0.1:9700
      GOEN_ECPAY_MERCHANT_ID: "2000132"
      GOEN_ECPAY_HASH_KEY: ejCk326UnaZWKisg
      GOEN_ECPAY_HASH_IV: q9jcZX8Ib9LM8wYk
      GOEN_ECPAY_LOGISTICS: b2c

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: The app as it was before the change
        if: matrix.side == 'before'
        run: git checkout d825b500 -- assets internal

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Start PostgreSQL
        run: make db-up

      - name: Migrate and seed
        run: |
          set -euo pipefail
          make migrate-up
          make db-seed

      - name: Start the storefront
        run: |
          set -euo pipefail
          git log -1 --format='commit %H parents %P %s'
          make build
          GOEN_INSECURE_COOKIES=1 ./bin/goen > server.log 2>&1 &
          echo $! > goen.pid
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null "$GOEN_URL/readyz"; then
              exit 0
            fi
            sleep 1
          done
          cat server.log >&2
          exit 1

      - name: Capture
        run: |
          set -euo pipefail
          chrome=$(scripts/resolve-chrome.sh)
          "$chrome" --version
          profile=$(mktemp -d)
          nice -n 10 "$chrome" --headless --disable-gpu --no-first-run \
            --remote-debugging-port=9333 --user-data-dir="$profile" about:blank > chrome-shots.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT
          sleep 3
          status=0

          echo '::group::demo history, goen stopped'
          pid=$(cat goen.pid)
          kill "$pid"
          while kill -0 "$pid" 2>/dev/null; do sleep 0.5; done
          psql "$GOEN_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'SET ROLE admin' \
            -c "SELECT upsert_staff('layout-check@goen.invalid', '', 'admin')"
          started=$(date +%s)
          psql "$GOEN_DATABASE_URL" -X -v ON_ERROR_STOP=1 -v demo_database=goen -f seed/demo_history.sql > history.log 2>&1 \
            || { tail -50 history.log; exit 1; }
          echo "demo history took $(( $(date +%s) - started )) s"
          psql "$GOEN_DATABASE_URL" -X -A -t -c "SELECT count(*) || ' orders, ' || count(*) FILTER (WHERE placed_at >= now() - interval '7 days') || ' in the last 7 days' FROM orders"
          echo '::endgroup::'

          token=$(openssl rand -hex 32)
          psql "$GOEN_DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -v token="$token" <<'SQL'
          SELECT id AS staff_id FROM users
          WHERE lower(email) = 'layout-check@goen.invalid' AND role = 'admin' \gset
          SET ROLE store;
          INSERT INTO sessions (token_hash, user_id, expires_at)
          VALUES (sha256(convert_to(:'token', 'UTF8')), :'staff_id', now() + interval '1 hour');
          SQL

          GOEN_INSECURE_COOKIES=1 ./bin/goen >> server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null "$GOEN_URL/readyz"; then
              break
            fi
            sleep 1
          done

          echo '::group::back office'
          ADMIN_TOKEN=$token CDP_PORT=9333 node scripts/admin-shots.mjs admin-shots-${{ matrix.side }} || status=$?
          echo '::endgroup::'
          file admin-shots-${{ matrix.side }}/*.png
          exit "$status"

      - name: Keep the shots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-shots-${{ matrix.side }}
          path: |
            admin-shots-${{ matrix.side }}/
            server.log
            chrome-shots.log
            history.log
          if-no-files-found: warn
