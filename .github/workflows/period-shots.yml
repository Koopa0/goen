name: period-shots

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: period-shots-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  # The previous revision (9f37db66) on the lines change (#1589), with this
  # probe's scripts; "after" is the current revision on the same lines change.
  BEFORE_SHA: be482a8f7ae22d2b1637fce9844edd97acc80ddf

jobs:
  period-shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      GOEN_DATABASE_URL: postgres://goen:goen@127.0.0.1:5433/goen?sslmode=disable
      GOEN_URL: http://127.0.0.1:9700
      GOEN_ECPAY_MERCHANT_ID: "2000132"
      GOEN_ECPAY_HASH_KEY: ejCk326UnaZWKisg
      GOEN_ECPAY_HASH_IV: q9jcZX8Ib9LM8wYk
      GOEN_ECPAY_LOGISTICS: b2c

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Build before and after
        run: |
          set -euo pipefail
          mkdir -p builds
          git log -1 --format='after: %H parents %P %s'
          go build -o builds/goen-after ./cmd/goen
          git worktree add wt-before "$BEFORE_SHA"
          (cd wt-before && git log -1 --format='before: %H %s' && go build -o ../builds/goen-before ./cmd/goen)
          ls -l builds

      - name: Start PostgreSQL
        run: make db-up

      - name: Migrate, seed and fixtures
        run: |
          set -euo pipefail
          make migrate-up
          make db-seed
          psql "$GOEN_DATABASE_URL" -X -q -v env=fixtures.env -f scripts/check-layout.sql
          sed -E 's/(TOKEN)=.*/\1=<hidden>/' fixtures.env

      - name: Capture
        run: |
          set -euo pipefail
          chrome=$(scripts/resolve-chrome.sh)
          "$chrome" --version
          profile=$(mktemp -d)
          nice -n 10 "$chrome" --headless --disable-gpu --no-first-run --lang=zh-TW \
            --remote-debugging-port=9333 --user-data-dir="$profile" about:blank > chrome-shots.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT
          sleep 3
          set -a; . ./fixtures.env; set +a
          status=0

          serve() {
            dir="$GITHUB_WORKSPACE"
            if [ "$1" = before ]; then dir="$GITHUB_WORKSPACE/wt-before"; fi
            (cd "$dir" && GOEN_INSECURE_COOKIES=1 exec "$GITHUB_WORKSPACE/builds/goen-$1" >> "$GITHUB_WORKSPACE/server-$1.log" 2>&1) &
            server_pid=$!
            for _ in $(seq 1 60); do
              if curl -sf -o /dev/null "$GOEN_URL/readyz"; then return 0; fi
              if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            echo "the $1 server never answered /readyz" >&2
            tail -50 "server-$1.log" >&2
            exit 1
          }
          stop() {
            kill "$server_pid"
            while kill -0 "$server_pid" 2>/dev/null; do sleep 0.5; done
          }

          # Four campaigns dated around today in shop time, each featuring the
          # layout campaign's products, and the delivered order moved ten days
          # back so today falls in its goodwill days.
          psql "$GOEN_DATABASE_URL" -X -v ON_ERROR_STOP=1 -v order="$RETURN_FORM_ORDER" -f - <<'SQL' || { echo 'could not seed the states'; status=1; }
          SET ROLE admin;
          INSERT INTO sale_campaigns (slug, title, title_en, tone, starts_at, ends_at) VALUES
            ('probe-last-day', '最後一天', 'Last day', 'stone',
             (shop_today() - 9)::timestamp AT TIME ZONE 'Asia/Taipei', (shop_today() + 1)::timestamp AT TIME ZONE 'Asia/Taipei'),
            ('probe-first-day', '第一天', 'First day', 'mist',
             shop_today()::timestamp AT TIME ZONE 'Asia/Taipei', (shop_today() + 6)::timestamp AT TIME ZONE 'Asia/Taipei'),
            ('probe-one-day', '只有一天', 'One day', 'sage',
             shop_today()::timestamp AT TIME ZONE 'Asia/Taipei', (shop_today() + 1)::timestamp AT TIME ZONE 'Asia/Taipei'),
            ('probe-not-started', '還沒開始', 'Not started', 'blush',
             (shop_today() + 3)::timestamp AT TIME ZONE 'Asia/Taipei', (shop_today() + 10)::timestamp AT TIME ZONE 'Asia/Taipei');
          INSERT INTO sale_campaign_products (campaign_id, product_id, position)
          SELECT c.id, cp.product_id, cp.position
          FROM sale_campaigns c
          CROSS JOIN sale_campaign_products cp
          JOIN sale_campaigns l ON l.id = cp.campaign_id AND l.slug = 'layout-campaign'
          WHERE c.slug LIKE 'probe-%';
          UPDATE order_shipments
             SET shipped_at = now() - interval '11 days', delivered_at = now() - interval '10 days'
           WHERE order_id = (SELECT id FROM orders WHERE order_number = :'order');
          SELECT slug, starts_at, ends_at, shop_today() AS today FROM sale_campaigns WHERE slug LIKE 'probe-%' ORDER BY ends_at;
          SELECT o.order_number, s.shipped_at, s.delivered_at
          FROM order_shipments s JOIN orders o ON o.id = s.order_id WHERE o.order_number = :'order';
          SQL
          for which in before after; do
            echo "::group::reshoot, $which"
            serve "$which"
            CDP_PORT=9333 node scripts/period-shots.mjs reshoot "shots/$which" || status=$?
            stop
            echo '::endgroup::'
          done

          # The same order delivered fourteen days back: today is its last goodwill day.
          psql "$GOEN_DATABASE_URL" -X -v ON_ERROR_STOP=1 -v order="$RETURN_FORM_ORDER" -f - <<'SQL' || { echo 'could not move the delivery'; status=1; }
          SET ROLE admin;
          UPDATE order_shipments
             SET shipped_at = now() - interval '15 days', delivered_at = now() - interval '14 days'
           WHERE order_id = (SELECT id FROM orders WHERE order_number = :'order');
          SELECT o.order_number, s.shipped_at, s.delivered_at, shop_today() AS today
          FROM order_shipments s JOIN orders o ON o.id = s.order_id WHERE o.order_number = :'order';
          SQL
          for which in before after; do
            echo "::group::last goodwill day, $which"
            serve "$which"
            CDP_PORT=9333 node scripts/period-shots.mjs lastgoodwill "shots/$which" || status=$?
            stop
            echo '::endgroup::'
          done

          file shots/*/*.png | wc -l
          exit "$status"

      - name: Keep the shots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: period-shots
          path: |
            shots/
            server-*.log
            chrome-shots.log
          if-no-files-found: warn
