name: Native popover interaction

on:
  pull_request:
    paths:
      - assets/js/goen.js
      - assets/css/app/app.css
      - scripts/popover-focus-check.mjs
      - internal/ui/pages/listing.templ
      - internal/ui/layouts/header.templ
      - internal/ui/pages/popover_native_browser_test.go
      - scripts/popover-safari-check.mjs
      - .github/workflows/popover-interaction.yml

permissions:
  contents: read

jobs:
  safari:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOEN_SAFARI_DRIVER_URL: http://127.0.0.1:4444
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Enable native Safari automation
        run: |
          sudo safaridriver --enable
          defaults write NSGlobalDomain AppleKeyboardUIMode -int 3
          defaults write com.apple.Safari WebKitTabToLinksPreferenceKey -bool true
          safaridriver --port 4444 > safari.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4444/status; then exit 0; fi
            sleep 1
          done
          cat safari.log
          exit 1
      - name: Native pointer and keyboard regression
        run: go test -count=1 -v -run '^TestPopoverPointerAndFocusInNativeBrowsers$' ./internal/ui/pages
      - name: Keep Safari automation output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safari-driver
          path: safari.log
          if-no-files-found: warn

  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOEN_POPOVER_CDP_PORT: '9222'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Start hosted Chrome
        run: |
          chrome=$(scripts/resolve-chrome.sh)
          "$chrome" --headless=new --disable-gpu --no-first-run --no-default-browser-check --remote-debugging-port=9222 --user-data-dir="$RUNNER_TEMP/popover-chrome" about:blank > chrome.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9222/json/version; then exit 0; fi
            sleep 1
          done
          cat chrome.log
          exit 1
      - name: Native pointer and keyboard regression
        run: go test -count=1 -v -run '^TestPopoverPointerAndFocusInNativeBrowsers$' ./internal/ui/pages
