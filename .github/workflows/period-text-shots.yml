name: period-text-shots

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: period-text-shots-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  # The period track branch's head, where this branch starts; "after" is this checkout.
  BEFORE_SHA: c0eeae3f3ebcdfb4c625d7fc75d60571e14fbd76

jobs:
  period-text-shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      GOEN_DATABASE_URL: postgres://goen:goen@127.0.0.1:5433/goen?sslmode=disable
      GOEN_URL: http://127.0.0.1:9700
      GOEN_ECPAY_MERCHANT_ID: "2000132"
      GOEN_ECPAY_HASH_KEY: ejCk326UnaZWKisg
      GOEN_ECPAY_HASH_IV: q9jcZX8Ib9LM8wYk
      GOEN_ECPAY_LOGISTICS: b2c

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Build before and after
        run: |
          set -euo pipefail
          mkdir -p builds
          git log -1 --format='after: %H parents %P %s'
          go build -o builds/goen-after ./cmd/goen
          git worktree add wt-before "$BEFORE_SHA"
          (cd wt-before && git log -1 --format='before: %H %s' && go build -o ../builds/goen-before ./cmd/goen)
          ls -l builds

      - name: Start PostgreSQL
        run: make db-up

      - name: Migrate, seed and fixtures
        run: |
          set -euo pipefail
          make migrate-up
          make db-seed
          psql "$GOEN_DATABASE_URL" -X -q -v env=fixtures.env -f scripts/check-layout.sql
          sed -E 's/(TOKEN)=.*/\1=<hidden>/' fixtures.env

      - name: Capture
        run: |
          set -euo pipefail
          chrome=$(scripts/resolve-chrome.sh)
          "$chrome" --version
          profile=$(mktemp -d)
          nice -n 10 "$chrome" --headless --disable-gpu --no-first-run --lang=zh-TW \
            --remote-debugging-port=9333 --user-data-dir="$profile" about:blank > chrome-shots.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT
          sleep 3
          set -a; . ./fixtures.env; set +a
          status=0

          serve() {
            dir="$GITHUB_WORKSPACE"
            if [ "$1" = before ]; then dir="$GITHUB_WORKSPACE/wt-before"; fi
            (cd "$dir" && GOEN_INSECURE_COOKIES=1 exec "$GITHUB_WORKSPACE/builds/goen-$1" >> "$GITHUB_WORKSPACE/server-$1.log" 2>&1) &
            server_pid=$!
            for _ in $(seq 1 60); do
              if curl -sf -o /dev/null "$GOEN_URL/readyz"; then return 0; fi
              if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            echo "the $1 server never answered /readyz" >&2
            tail -50 "server-$1.log" >&2
            exit 1
          }
          stop() {
            kill "$server_pid"
            while kill -0 "$server_pid" 2>/dev/null; do sleep 0.5; done
          }

          shoot() { # which, locale, outdir
            echo "::group::$1, $2, $3"
            serve "$1"
            CDP_PORT=9333 node scripts/period-text-shots.mjs "$2" "shots/$3" || status=$?
            stop
            echo '::endgroup::'
          }

          # Every place, payments off (no payment key), the campaign as seeded.
          for which in before after; do
            for locale in zh-Hant en; do shoot "$which" "$locale" "$which/$locale"; done
          done

          # The pay page with a test key, where a payment can start.
          (
            export GOEN_STRIPE_API_KEY=sk_test_probe GOEN_STRIPE_WEBHOOK_SECRET=whsec_probe ONLY=pay
            for which in before after; do
              for locale in zh-Hant en; do shoot "$which" "$locale" "$which-paymenton/$locale"; done
            done
          )

          # The campaign ending at a set time, three days out, tomorrow and today, in the shop's zone. A
          # clock that has already passed today ends the campaign, so today's is 18:00 only before 17:30.
          export ONLY=endtime
          today_hours=$(psql "$GOEN_DATABASE_URL" -X -A -t -c "select case when (now() at time zone 'Asia/Taipei')::time < '17:30' then '18 hours' else '23 hours 30 minutes' end")
          for state in "three:3 days 18 hours" "tomorrow:1 day 18 hours" "today:$today_hours"; do
            name=${state%%:*}; offset=${state#*:}
            psql "$GOEN_DATABASE_URL" -X -q -c "update sale_campaigns set starts_at = now() - interval '1 day', ends_at = (date_trunc('day', now() at time zone 'Asia/Taipei') + interval '$offset') at time zone 'Asia/Taipei' where slug = 'autumn-picks'"
            psql "$GOEN_DATABASE_URL" -X -A -t -c "select 'seeded $name', ends_at at time zone 'Asia/Taipei' from sale_campaigns where slug = 'autumn-picks'"
            for which in before after; do
              for locale in zh-Hant en; do shoot "$which" "$locale" "$which-end-$name/$locale"; done
            done
          done

          file shots/*/*.png | wc -l
          exit "$status"

      - name: Keep the shots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: period-text-shots
          path: |
            shots/
            server-*.log
            chrome-shots.log
          if-no-files-found: warn
