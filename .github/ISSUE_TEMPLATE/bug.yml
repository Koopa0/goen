name: Bug report
description: Something goen does is wrong.
title: "bug: "
labels: [needs-repro]
body:
  - type: markdown
    attributes:
      value: |
        Two reports go somewhere other than here.

        **Something moves money, stock or a tax document outside its guarded
        path, or a browser reaches an order it did not place.** Report that
        through [GitHub's private advisory form](https://github.com/Koopa0/goen/security/advisories/new),
        never in a public issue.

        **A back-office page answers 500 right after you pulled.** Run
        `make migrate-up` first, and if it still answers 500,
        `PGOPTIONS='-c goen.catalogue_seed=development' make db-reset`: a database
        behind `migrations/`, or built from `migrations/001` before it was frozen,
        is missing what the code reads.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what goen did. Quote the response or the log line.
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: >-
        The shortest path from `PGOPTIONS='-c goen.catalogue_seed=development' make db-reset && make run` to the wrong
        behaviour. Forms and URLs are better than prose: which page, which
        fields, which button.
      placeholder: |
        1. Add any in-stock variant to the cart
        2. POST /checkout with store_pickup and no postal code
        3. ...
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short HEAD`"
    validations:
      required: true

  - type: dropdown
    id: harm
    attributes:
      label: Who is harmed, and how
      options:
        - money or tax
        - stock or order
        - personal data or security
        - a task is blocked (including accessibility)
        - wrong text a customer acts on
        - staff-only inconvenience
        - tests or tooling
    validations:
      required: true

  - type: textarea
    id: guard
    attributes:
      label: Which guard stayed green
      description: >-
        Optional, and the most useful line in the report. goen's tests derive
        what they cover from the schema and the source; if a defect got through,
        something in that coverage has a gap. Name the test or constraint that
        should have refused this and did not.

  - type: checkboxes
    id: bar
    attributes:
      label: Before filing
      description: The filing bar is in [CONTRIBUTING.md](https://github.com/Koopa0/goen/blob/main/CONTRIBUTING.md#filing-an-issue).
      options:
        - label: I reproduced this on the commit above, or the title says UNVERIFIED.
          required: true
        - label: I searched open and closed issues, including `noise:` and `duplicate:` titles.
          required: true
        - label: This is one defect. If it cites a law or standard, it names the article, why it applies to this shop, and the code path.
          required: true
